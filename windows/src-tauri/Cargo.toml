[package]
name = "workflow-pdf-pro"
version = "1.0.6"
description = "Workflow PDF Pro für Windows"
edition = "2021"
publish = false
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "=2.14.0"
wfp-core = { path = "../core" }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Foundation_Collections",
  "Storage",
  "Win32_System_Registry",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
# Nur für den GitHub-Prüfbau: öffnet den lokalen Prüfzugang (CDP) für Playwright.
messprobe = []

