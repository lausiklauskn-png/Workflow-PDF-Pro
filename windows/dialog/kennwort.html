<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src ipc: http://ipc.localhost https://ipc.localhost">
<title>Workflow PDF Pro</title>
<link rel="stylesheet" href="dialog.css">
<script defer src="kennwort.js"></script>
</head>
<body>
<main>
<h1 id="titel"></h1>
<section id="normal">
<input id="erstes" type="password" autocomplete="off">
<input id="zweites" type="password" autocomplete="off" hidden>
<label id="hinweisZeile" hidden><input id="hinweis" type="checkbox"><span id="hinweisText"></span></label>
</section>
<section id="ersatz" hidden>
<p id="ersatzHilfe"></p>
<input id="teil1" class="teil" type="text" autocomplete="off" spellcheck="false">
<input id="teil2" class="teil" type="text" autocomplete="off" spellcheck="false">
<input id="teil3" class="teil" type="text" autocomplete="off" spellcheck="false">
<input id="neu1" type="password" autocomplete="off">
<input id="neu2" type="password" autocomplete="off">
</section>
<label><input id="merken" type="checkbox" checked><span id="merkenText"></span></label>
<p id="status" role="status"></p>
<p id="vergessenZeile" hidden><button id="vergessen" class="link"></button></p>
<div class="zeile"><button id="abbrechen"></button><button id="weiter" class="haupt"></button></div>
</main>
</body>
</html>
