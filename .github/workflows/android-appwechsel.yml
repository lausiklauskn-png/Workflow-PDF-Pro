name: Android-Appwechsel mit veröffentlichter Familienakte
on:
  push:
    branches: [codex/android-appwechsel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appwechsel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run sync:android
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Wirklicher Android-Chooser, zwei Tasks, kalter und warmer Empfänger
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            python3 tools/native/webview-runtime.py collect work/webview-runtime
            python3 tools/native/webview-runtime.py install work/webview-runtime
            bash tools/native/install-family-share-probe.sh
            cd android && ./gradlew --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.familyprojekt.workflowpdf.pro.NativeAppSwitchTest
      - name: Android-Protokoll sichern
        if: always()
        run: adb logcat -d > appwechsel-logcat.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-appwechsel-${{ github.sha }}
          path: |
            appwechsel-logcat.txt
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 14
