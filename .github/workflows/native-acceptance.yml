name: Vollständige native Android-Freigabeprüfung
on:
  workflow_dispatch:
  push:
    branches: [main, codex/native-android-build]
permissions:
  contents: read
concurrency:
  group: native-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-freefont-ttf fonts-roboto-unhinted
      - run: echo "FONTCONFIG_FILE=$(node tools/native/android-fontconfig.mjs)" >> "$GITHUB_ENV"
      - name: Unveränderte vollständige Originalkette einschließlich Schutzmodule
        run: npm test
      - name: Vollständig gebündelte App und native Produktoberflächen
        run: npm run test:native-web
      - name: Externen Chrome-Helfer mit ursprünglicher DOM-Engine gegenprüfen
        run: node --test tools/native/test-chrome-transport.mjs
      - name: Speicherfehler, Migration, Journal und gemeinsamer Releaseauftrag
        run: node --test tools/native/test-vault-codec.mjs tools/native/test-vault-records.mjs tools/native/test-vault-journal.mjs tools/native/test-vault-gate.mjs tools/native/test-vault-migration.mjs tools/signing/test-request-release.mjs
  android-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            profile: pixel_c
          - api: 35
            profile: pixel_2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run sync:android
      - name: Regulärer Bau, Lint und JVM
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleRelease lintRelease testReleaseUnitTest
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Produkt, Speicher, Schutz, Gerätebrücken, echte Modelle und OCR
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            bash tools/native/run-connected.sh
            python3 tools/native/verify-signed-install.py android/app/build/outputs/apk/debug/app-debug.apk --development-probe
      - name: Tatsächliche Produktfälle vollständig verlangen
        env:
          ANDROID_TEST_API: ${{ matrix.api }}
        run: node tools/native/assert-native-results.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-acceptance-${{ matrix.api }}
          path: |
            work/acceptance/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/
          if-no-files-found: error
          retention-days: 7
  native-smoke:
    needs: [source-and-product, android-product]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-acceptance-*
          path: evidence
          merge-multiple: false
      - name: Exakten Commit und beide Android-Stände verlangen
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          for(const api of [31,35]){
            const proof=JSON.parse(await readFile(`evidence/native-acceptance-${api}/work/acceptance/native-${api}.json`));
            assert.equal(proof.commit,process.env.GITHUB_SHA);assert.equal(proof.api,api);
            assert.ok(proof.tests>=44);assert.equal(proof.reinstallPreservesData,true);for(const key of ['failures','errors','skipped'])assert.equal(proof[key],0);
          }
          console.log('Vollständige Originalkette und Produktprüfungen auf Android 12/15 bestanden. Physische Samsung-Hardware und manuelle Chrome-Menüübersetzung werden dadurch nicht behauptet.');
          JS
