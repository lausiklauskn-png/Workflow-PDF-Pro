name: Windows-Messprobe (Tauri/WebView2)
# Messprobe vor der Planfreigabe: baut die Tauri-Hülle um den unveränderten Kern,
# installiert sie still auf einem GitHub-Windows-Runner und misst im echten
# WebView2-Fenster. Kein Release, keine Signatur, kein Nachweis für Klaus' Rechner.
on:
  push:
    branches: ['claude/windows-**']
    paths: ['windows/**', '.github/workflows/windows-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Zeilenenden unverändert lassen (bytegleicher Kern)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Kern bytegleich prüfen und lokal bündeln
        run: |
          npm ci
          npm run verify:upstream
          npm run build:web
      - name: Windows-Werkzeuge
        working-directory: windows
        run: |
          npm ci
          rustc --version
          cargo --version
      - name: Tauri-App und Installer bauen
        working-directory: windows
        run: npx tauri build
      - name: Installer beschreiben
        run: |
          $files = Get-ChildItem windows/src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi
          New-Item -ItemType Directory -Force probe-out | Out-Null
          foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)  $($f.Length) Bytes" | Tee-Object -Append probe-out/installer.txt
            Copy-Item $f.FullName probe-out/
          }
      - name: Still installieren, starten, messen, neu starten, deinstallieren, neu installieren
        timeout-minutes: 20
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem probe-out -Filter *-setup.exe | Select-Object -First 1).FullName
          $appDir = Join-Path $env:LOCALAPPDATA 'Workflow PDF Pro'
          $exe = Join-Path $appDir 'workflow-pdf-pro.exe'
          function Wait-Run($file, $arguments) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            if (!$p.WaitForExit(180000)) { $p | Stop-Process -Force; throw "Zeitgrenze: $file $arguments" }
            "Fertig: $file $arguments -> $($p.ExitCode)" | Tee-Object -Append probe-out/ablauf.txt
          }
          function Start-App { $p = Start-Process -FilePath $exe -PassThru; Start-Sleep 5; return $p }
          function Stop-App { Get-Process workflow-pdf-pro -ErrorAction SilentlyContinue | Stop-Process -Force; Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep 3 }

          Wait-Run $setup '/S'
          if (!(Test-Path $exe)) { Get-ChildItem $appDir -ErrorAction SilentlyContinue; throw "Installation fehlt: $exe" }
          "Installiert: $exe" | Tee-Object -Append probe-out/ablauf.txt

          Start-App | Out-Null
          "App läuft: $((Get-Process workflow-pdf-pro -ErrorAction SilentlyContinue).Count) / WebView2: $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count)" | Tee-Object -Append probe-out/ablauf.txt
          try { (Invoke-WebRequest http://127.0.0.1:9222/json -UseBasicParsing -TimeoutSec 10).Content | Tee-Object -Append probe-out/ablauf.txt } catch { "CDP: $_" | Tee-Object -Append probe-out/ablauf.txt }
          node windows/probe/probe.mjs erst probe-out/erst.json
          Stop-App

          Start-App | Out-Null
          node windows/probe/probe.mjs neustart probe-out/neustart.json
          Stop-App

          Wait-Run (Join-Path $appDir 'uninstall.exe') '/S'
          Start-Sleep 5
          "Nach Deinstallation vorhanden: $(Test-Path $exe)" | Tee-Object -Append probe-out/ablauf.txt
          Wait-Run $setup '/S'
          Start-App | Out-Null
          node windows/probe/probe.mjs neuinstallation probe-out/neuinstallation.json
          Stop-App
      - name: Messwerte als Hinweis zeigen
        if: always()
        run: |
          if (!(Test-Path probe-out)) { exit 0 }
          Get-ChildItem probe-out -Filter *.json | ForEach-Object {
            $t = (Get-Content $_.FullName -Raw) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            if ($t.Length -gt 3800) { $t = $t.Substring(0,3800) }
            Write-Output "::notice title=Messprobe $($_.BaseName)::$t"
          }
          if (Test-Path probe-out/installer.txt) { Write-Output "::notice title=Installer::$((Get-Content probe-out/installer.txt) -join ' | ')" }
          if (Test-Path probe-out/ablauf.txt) { Write-Output "::notice title=Ablauf::$((Get-Content probe-out/ablauf.txt) -join ' | ')" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-messprobe
          path: probe-out/
          retention-days: 14
