name: Optimierte Android-Überinstallation diagnostizieren
on:
  push:
    branches: [codex/android-update-diagnose]
    paths: ['.github/workflows/android-update-diagnose.yml', 'tools/native/verify-signed-install.py']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-production-apk
          path: unsigned-apk
          run-id: 41526813777
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: webview-runtime
          path: work/webview-runtime
          run-id: 41470284268
          github-token: ${{ github.token }}
      - name: Unveränderten optimierten Bau mit einem Wegwerf-Prüfschlüssel versehen
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0' > /dev/null
          keytool -genkeypair -keystore "$RUNNER_TEMP/diagnostic.jks" -storepass android -keypass android -alias diagnostic -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Temporary diagnostic only' > /dev/null 2>&1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/diagnostic.jks" --ks-pass pass:android --ks-key-alias diagnostic --out work/diagnostic.apk unsigned-apk/app-release-unsigned.apk
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('work/diagnostic.apk')
          metadata={'apkSha256':hashlib.sha256(p.read_bytes()).hexdigest(),'applicationId':'de.familyprojekt.workflowpdf.pro','versionCode':12,'commit':'e2c57b3f514c0c3f118c23f243bf5ee9fe756bb7','diagnosticOnly':True,'signing':'temporary fixture, not production identity'}
          Path(str(p)+'.json').write_text(json.dumps(metadata))
          print(json.dumps(metadata))
          PY
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gleiche sichtbare Überinstallation; keine Veröffentlichung und keine Produktionssignatur
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            python3 tools/native/webview-runtime.py install work/webview-runtime
            adb logcat -c
            mkdir -p work/update-diagnostics
            bash -c 'set +e; python3 tools/native/verify-signed-install.py work/diagnostic.apk; probe_status=$?; adb logcat -d > work/update-diagnostics/full-logcat.txt; adb shell dumpsys activity activities > work/update-diagnostics/activity.txt; tail -n 100 work/update-diagnostics/full-logcat.txt; exit "$probe_status"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimized-update-diagnostics-not-a-release
          path: |
            work/update-diagnostics/
            work/acceptance/reinstall-diagnostics/
          if-no-files-found: warn
          retention-days: 7
