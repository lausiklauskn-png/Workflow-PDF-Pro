name: Workflow PDF Pro für Windows veröffentlichen (unsigniert)
# Klaus' Wahl vom 22.10.2026: manueller, unsignierter Setup.exe-Installer.
# Kein Signierkonto, kein Herausgeberzertifikat, kein Update-Schlüssel, kein Updater.
# Veröffentlicht wird genau der Installer, den "Windows-App (Tauri)" für diesen
# main-Commit gebaut und abgenommen hat. Kein Neubau; so wurde auch 1.0.1 veröffentlicht.
# Anstoß: "Run workflow" oder Git-Brücke release-requests/windows-vX.Y.Z (release-request.yml).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Windows-Tag, z. B. windows-v1.0.3 (muss zur Version in tauri.conf.json passen)
        required: true
        type: string
      commit:
        description: Vollständiger, zuvor geprüfter main-Commit (aktueller main-Stand)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: workflow-pdf-pro-windows-release
  cancel-in-progress: false
jobs:
  pruefen:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.gates.outputs.run }}
      version: ${{ steps.gates.outputs.version }}
      installer: ${{ steps.gates.outputs.installer }}
      sha256: ${{ steps.gates.outputs.sha256 }}
      size: ${{ steps.gates.outputs.size }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Version, main-Stand, Abnahme und unsignierten Bau verlangen
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$GITHUB_REPOSITORY" == 'lausiklauskn-png/Workflow-PDF-Pro' ]] || fail 'Falsches Repository.'
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ && "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]] || fail 'Commit passt nicht zum gestarteten main-Stand.'
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$head" == "$GITHUB_SHA" ]] || fail 'main wurde geändert. Nur den aktuellen main-Commit veröffentlichen.'
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          [[ "$RELEASE_TAG" =~ ^windows-v(${semver})$ ]] || fail 'Tag muss windows-vX.Y.Z lauten.'
          version="${BASH_REMATCH[1]}"
          test "$(jq -r .version windows/src-tauri/tauri.conf.json)" = "$version" || fail 'Tag passt nicht zu tauri.conf.json.'
          test "$(jq -r .version windows/package.json)" = "$version" || fail 'Tag passt nicht zu windows/package.json.'
          grep -qx "version = \"$version\"" windows/src-tauri/Cargo.toml || fail 'Tag passt nicht zu Cargo.toml.'

          # Ehrliche Beschriftung: nur Ausgaben ohne Update-Schlüssel und ohne Updater-Dateien.
          if grep -q '[^[:space:]]' windows/signing/updater.pub; then
            fail 'updater.pub ist gesetzt. Dieser Ablauf ist nur für Ausgaben ohne automatische Updates.'
          fi
          test "$(jq -r '.bundle.createUpdaterArtifacts // false' windows/src-tauri/tauri.conf.json)" = 'false' \
            || fail 'createUpdaterArtifacts ist aktiv. Dieser Ablauf baut keine Update-Dateien.'

          # Nie ersetzen; Version muss über allen bisherigen Windows-Ausgaben liegen.
          newer() {
            local a1 a2 a3 b1 b2 b3
            IFS=. read -r a1 a2 a3 <<<"$1"; IFS=. read -r b1 b2 b3 <<<"$2"
            (( a1 > b1 || (a1 == b1 && (a2 > b2 || (a2 == b2 && a3 > b3))) ))
          }
          tags=$( { git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY.git" 'refs/tags/windows-v*' | sed 's#.*refs/tags/##'
                    gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'; } | sort -u )
          while IFS= read -r old; do
            [[ -n "$old" ]] || continue
            [[ "$old" == "$RELEASE_TAG" ]] && fail 'Diese Windows-Version existiert bereits. Sie wird nie ersetzt.'
            if [[ "$old" =~ ^windows-v(${semver})$ ]]; then
              newer "$version" "${BASH_REMATCH[1]}" || fail "Version muss über $old liegen."
            fi
          done <<<"$tags"

          # Bau- und Abnahmelauf "Windows-App (Tauri)" auf genau diesem main-Commit.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/windows-app.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == "main" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.run_started_at) | last | .id // empty')
          [[ -n "$run" ]] || fail 'Kein erfolgreicher Windows-Bau- und Abnahmelauf auf main für diesen Commit.'

          installer="Workflow-PDF-Pro-Windows-$version-Setup.exe"
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name windows-installer --dir release-files \
            || fail "Abgenommener Installer aus Lauf $run fehlt oder ist abgelaufen. windows-app.yml auf main erneut laufen lassen."
          (cd release-files && sha256sum -c "$installer.sha256") || fail 'Prüfsumme des abgenommenen Installers stimmt nicht.'
          sum=$(cut -d' ' -f1 "release-files/$installer.sha256")
          size=$(stat -c %s "release-files/$installer")
          {
            echo "run=$run"; echo "version=$version"; echo "installer=$installer"
            echo "sha256=$sum"; echo "size=$size"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Abgenommen::Lauf $run, $installer, $size Bytes, SHA-256 $sum"

  installieren:
    needs: pruefen
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Genau diesen Installer unsigniert installieren, starten und entfernen
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.pruefen.outputs.run }}
          INSTALLER: ${{ needs.pruefen.outputs.installer }}
          SHA256: ${{ needs.pruefen.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:RUN --repo $env:GITHUB_REPOSITORY --name windows-installer --dir release-files
          if ($LASTEXITCODE -ne 0) { throw 'Abgenommener Installer fehlt.' }
          $file = "release-files/$env:INSTALLER"
          if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLower() -cne $env:SHA256) { throw 'Prüfsumme weicht ab.' }
          # Die Hinweise sagen "unsigniert". Das muss stimmen.
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -ne 'NotSigned') { throw "Erwartet unsigniert, gefunden: $($sig.Status)" }
          $p = Start-Process -FilePath $file -ArgumentList '/S' -PassThru
          if (!$p.WaitForExit(180000) -or $p.ExitCode -ne 0) { throw 'Installation fehlgeschlagen.' }
          $dir = Join-Path $env:LOCALAPPDATA 'Workflow PDF Pro'
          $app = Start-Process (Join-Path $dir 'workflow-pdf-pro.exe') -PassThru
          Start-Sleep 8
          if ($app.HasExited) { throw 'Installierte App läuft nicht.' }
          $app | Stop-Process -Force
          Start-Sleep 3
          $p = Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -PassThru
          if (!$p.WaitForExit(180000) -or $p.ExitCode -ne 0) { throw 'Deinstallation fehlgeschlagen.' }
          Write-Output 'Unsignierter Installer: Installation, Start und Deinstallation in Ordnung.'

  veroeffentlichen:
    needs: [pruefen, installieren]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Veröffentlichen, anonym herunterladen und vergleichen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RUN: ${{ needs.pruefen.outputs.run }}
          VERSION: ${{ needs.pruefen.outputs.version }}
          INSTALLER: ${{ needs.pruefen.outputs.installer }}
          SHA256: ${{ needs.pruefen.outputs.sha256 }}
          SIZE: ${{ needs.pruefen.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$head" == "$GITHUB_SHA" ]] || fail 'main wurde inzwischen geändert. Nichts veröffentlicht.'
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then fail 'Release existiert bereits.'; fi
          [[ -z "$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG")" ]] || fail 'Tag existiert bereits.'

          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name windows-installer --dir release-files
          test "$(sha256sum "release-files/$INSTALLER" | cut -d' ' -f1)" = "$SHA256" || fail 'Prüfsumme weicht ab.'
          test "$(stat -c %s "release-files/$INSTALLER")" = "$SIZE" || fail 'Größe weicht ab.'

          cat > notes.md <<NOTES
          Workflow PDF Pro für Windows $VERSION (Windows 10 und 11, 64 Bit).

          **Installation:** \`$INSTALLER\` herunterladen und doppelt anklicken. Es sind keine Administratorrechte nötig.

          **Unsigniert:** Der Installer hat keine Herausgebersignatur. Deshalb warnt Windows SmartScreen mit „Der Computer wurde durch Windows geschützt“.
          Dann „Weitere Informationen“ und danach „Trotzdem ausführen“ wählen.
          Auf verwalteten Rechnern oder mit strengeren Sicherheitseinstellungen kann Windows die Ausführung verhindern.

          **Keine automatischen Updates:** Die App sucht nicht selbst nach neuen Versionen.
          Eine neue Version wird von Hand heruntergeladen und bei geschlossener App über die vorhandene installiert.
          Vorher nicht deinstallieren. Einstellungen, Bibliothek und Tresor bleiben erhalten. Eine Sicherung ersetzt das nicht.

          Prüfstand: gebaut und abgenommen auf einem GitHub-Windows-Rechner (Lauf $RUN), Quellstand $GITHUB_SHA.
          Auf einem eigenen Windows-PC ist diese Version noch nicht gemessen.

          SHA-256: \`$SHA256\` · Größe: $SIZE Bytes
          NOTES

          created=0
          rollback() {
            if [[ "$created" == 1 ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=true \
                || echo '::error::Rücknahme als Entwurf nicht bestätigt. Release von Hand prüfen.'
            fi
          }
          trap 'rollback' ERR

          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --latest=false \
            --title "Workflow PDF Pro für Windows $VERSION" --notes-file notes.md \
            "release-files/$INSTALLER" "release-files/$INSTALLER.sha256"
          created=1
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

          # Ohne Anmeldung herunterladen, wie ein Nutzer es tut.
          mkdir check
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$INSTALLER"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --proto '=https' --proto-redir '=https' \
            -o "check/$INSTALLER" "$url"
          test "$(sha256sum "check/$INSTALLER" | cut -d' ' -f1)" = "$SHA256"
          test "$(stat -c %s "check/$INSTALLER")" = "$SIZE"
          echo "::notice title=Veröffentlicht (unsigniert)::$url"
