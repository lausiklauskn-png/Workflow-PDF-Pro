name: Gemeinsamen PDF-Kern aktualisieren
on:
  schedule:
    - cron: '3 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/onboarding/update.mjs'
      - 'tools/onboarding/update-pr.mjs'
      - 'tools/onboarding/test-update*.mjs'
      - '.github/workflows/pdf-kern-update.yml'
permissions:
  contents: read
concurrency:
  group: pdf-kern-update-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vorbereiten:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      update: ${{ steps.stand.outputs.update }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lausiklauskn-png/Workflow-PDF
          path: work/Workflow-PDF
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Gemeinsamen Kern mit vorhandenem Kopierwerkzeug vorbereiten
        id: stand
        run: |
          node tools/onboarding/test-update.mjs
          node tools/onboarding/test-update-pr.mjs
          mkdir -p work/pdf-update
          node tools/onboarding/update.mjs --lokal --anwenden > work/pdf-update/stand.json
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('work/pdf-update/stand.json')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'update='+s.updateVorhanden+'\n');"
          git add -N -- upstream/workflow-pdf docs/portierung/QUELLDATEIEN-SHA256.json docs/portierung/BEDIENELEMENTE.json docs/portierung/FUNKTIONEN-QUELLINDEX.json
          git diff --binary -- upstream/workflow-pdf docs/portierung/QUELLDATEIEN-SHA256.json docs/portierung/BEDIENELEMENTE.json docs/portierung/FUNKTIONEN-QUELLINDEX.json > work/pdf-update/update.patch
      - run: npm ci
      - run: npm ci --prefix upstream/workflow-pdf
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-freefont-ttf fonts-roboto-unhinted
      - run: echo "FONTCONFIG_FILE=$(node tools/native/android-fontconfig.mjs)" >> "$GITHUB_ENV"
      - name: Unveränderten Kern und native Anbindungen prüfen
        run: |
          npm test
          npm run test:native-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gemeinsamer-pdf-kern-update
          path: work/pdf-update/
          retention-days: 30
  update-pr:
    if: needs.vorbereiten.outputs.update == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: vorbereiten
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gemeinsamer-pdf-kern-update
          path: work/pdf-update
      - name: Geprüften Kern als Update-PR vorbereiten
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/onboarding/update-pr.mjs
