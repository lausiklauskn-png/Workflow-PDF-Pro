name: Gemeinsamen Release-Auftrag weitergeben
on:
  push:
    branches: ['release-requests/v*', 'release-requests/windows-v*']
permissions:
  contents: read
  actions: write
concurrency:
  group: workflow-pdf-pro-release-request
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-24.04
    steps:
      # No checkout, package install or signing secret is needed here. An agent
      # with Git push access can request the same guarded main release without
      # sharing another agent's API identity or the APK unlock key.
      # release-requests/vX.Y.Z         -> Android (workflow-pdf-release.yml)
      # release-requests/windows-vX.Y.Z -> Windows, unsigniert (windows-release.yml)
      - name: Nur unveränderten aktuellen main-Commit weitergeben
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_REF: ${{ github.ref }}
          REQUEST_COMMIT: ${{ github.event.after }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'lausiklauskn-png/Workflow-PDF-Pro' ]]
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ "$REQUEST_REF" =~ ^refs/heads/release-requests/v${semver}$ ]]; then
            workflow=workflow-pdf-release.yml
          elif [[ "$REQUEST_REF" =~ ^refs/heads/release-requests/windows-v${semver}$ ]]; then
            workflow=windows-release.yml
          else
            echo 'Unbekannter Release-Auftrag.'; exit 1
          fi
          [[ "$REQUEST_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$REQUEST_COMMIT" == "$current" ]]
          tag=${REQUEST_REF#refs/heads/release-requests/}
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main \
            -f "tag=$tag" -f "commit=$REQUEST_COMMIT"
          echo "Release-Workflow $workflow angefordert. Das bestätigt noch keine Veröffentlichung."
